<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>

    <style>

        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body{
            background-color: #eeeeee;
            font-family: serif;
        }

        .container{
            width: 75%;
            margin: auto;
            padding: 30px;
        }

        h1{
            text-align: center;
            color: darkblue;
            margin-bottom: 40px;
            font-size: 50px;
        }

        form label{
            display: block;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            margin-bottom: 10px;
        }

        input,
        select,
        textarea{
            width: 100%;
            padding: 15px;
            border: 1px solid gray;
            border-radius: 5px;
            font-size: 18px;
        }

        .gender{
            margin-top: 10px;
            margin-bottom: 20px;
            font-size: 18px;
        }

        .gender input{
            width: auto;
            margin-right: 8px;
            margin-left: 10px;
        }

        textarea{
            height: 100px;
            resize: none;
        }

        button{
            background-color: darkblue;
            color: white;
            border: none;
            padding: 12px 25px;
            margin-top: 20px;
            font-size: 20px;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover{
            background-color: navy;
        }

        h2{
            text-align: center;
            color: darkblue;
            margin-top: 50px;
            margin-bottom: 30px;
            font-size: 45px;
        }

        table{
            width: 100%;
            border-collapse: collapse;
            background-color: white;
        }

        table th,
        table td{
            border: 1px solid black;
            padding: 15px;
            text-align: center;
            font-size: 20px;
        }

        table th{
            background-color: darkblue;
            color: white;
        }

    </style>

</head>
<body>

    <div class="container">

        <h1>Student Registration Form</h1>

        <form>

            <label>Full Name</label>
            <input type="text" placeholder="Enter your name">

            <label>Email</label>
            <input type="email" placeholder="Enter your email">

            <label>Password</label>
            <input type="password" placeholder="Enter password">

            <label>Phone Number</label>
            <input type="tel" placeholder="Enter phone number">

            <label>Date of Birth</label>
            <input type="date">

            <label>Select Course</label>

            <select>
                <option>HTML</option>
                <option>CSS</option>
                <option>JavaScript</option>
                <option>React</option>
            </select>

            <label>Gender</label>

            <div class="gender">
                <input type="radio" name="gender"> Male
                <input type="radio" name="gender"> Female
            </div>

            <label>Address</label>

            <textarea placeholder="Enter address"></textarea>

            <button type="submit">Register</button>

        </form>

        <h2>Student Data Table</h2>

        <table>

            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Course</th>
                <th>City</th>
            </tr>

            <tr>
                <td>1</td>
                <td>Rahul</td>
                <td>HTML</td>
                <td>Mumbai</td>
            </tr>

            <tr>
                <td>2</td>
                <td>Sneha</td>
                <td>CSS</td>
                <td>Pune</td>
            </tr>

            <tr>
                <td>3</td>
                <td>Amit</td>
                <td>JavaScript</td>
                <td>Nashik</td>
            </tr>

            <tr>
                <td>4</td>
                <td>Priya</td>
                <td>React</td>
                <td>Nagpur</td>
            </tr>

        </table>

    </div>

</body>
</html>
